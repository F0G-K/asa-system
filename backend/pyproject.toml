[project]
name = "asa-system"
version = "0.1.0"
description = "自动化安全评估系统（ASA System）"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "argon2-cffi>=23.1.0",
    "celery[redis]>=5.4.0,<6",
    "httpx>=0.28.0",
    "langgraph>=0.6.0,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "testcontainers[postgres,redis]>=4.9.0",
]

[project.scripts]
asa-api = "backend.api.startup:main"
asa-start = "backend.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = ["E", "F", "I", "W", "UP", "B"]
lint.ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
