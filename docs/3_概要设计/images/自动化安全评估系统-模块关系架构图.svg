  <path d="M810 690 H850" fill="none" stroke="#2f6fed" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="794" y="652" width="68" height="22" rx="6" class="edge-bg"/>
  <text x="800" y="668" class="edge-label">调度任务</text>

  <path d="M1260 731 V750" fill="none" stroke="#7c4dff" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M1245 825 H1270" fill="none" stroke="#7c4dff" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <path d="M2100 668 H2140" fill="none" stroke="#1a9a68" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="2088" y="630" width="50" height="22" rx="6" class="edge-bg"/>
  <text x="2094" y="646" class="edge-label">运行时</text>

  <!-- Data connections from control/worker to lower layer -->
  <path d="M420 950 V1075" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="432" y="978" width="70" height="22" rx="6" class="edge-bg"/>
  <text x="438" y="994" class="edge-label">事务读写</text>
  <path d="M1200 950 V1075" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="1212" y="978" width="110" height="22" rx="6" class="edge-bg"/>
  <text x="1218" y="994" class="edge-label">状态 / 结果落库</text>
  <path d="M1450 950 V1075" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="1462" y="978" width="52" height="22" rx="6" class="edge-bg"/>
  <text x="1468" y="994" class="edge-label">事件流</text>
  <path d="M1960 950 V1075" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="1972" y="978" width="70" height="22" rx="6" class="edge-bg"/>
