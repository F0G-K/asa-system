<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — ASA</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-card">
    <h1 class="auth-card__title">ASA System</h1>
    <p class="auth-card__subtitle">自动化安全评估系统</p>
    <div class="form-group" style="margin-top:var(--spacing-2xl)">
      <label class="form-label form-label--required" for="username">用户名</label>
      <input id="username" class="form-input" type="text" placeholder="请输入用户名" autocomplete="username" style="width:100%">
    </div>
    <div class="form-group">
      <label class="form-label form-label--required" for="password">密码</label>
      <input id="password" class="form-input" type="password" placeholder="请输入密码" autocomplete="current-password" style="width:100%">
    </div>
    <button class="btn btn--primary btn--lg" style="width:100%;margin-top:var(--spacing-lg)" onclick="location.href='project-list.html'">登 录</button>
  </div>
</div>
</body>
</html>
